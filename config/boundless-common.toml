#A list of quest category IDs to completely disable.
disabledQuestCategories = []
#Instance questpack IDs explicitly enabled by the server.
appliedQuestPacks = []
#Instance questpack IDs explicitly disabled by the server.
disabledQuestPacks = []

[UI]
	#Pin the Quest hud to the: bottom_left, bottom_right, top_left, top_right
	pinnedQuestHudPosition = "bottom_left"
	#If true, hides the quest book button in the inventory screen.
	hideQuestBookInInventory = false
	#Quest book button position in inventory: beside_recipe_book, above_offhand_slot
	questBookInventoryButtonPosition = "beside_recipe_book"
	#If true, centers inventory and quest panel together when the quest panel is open.
	centerInventoryWithQuestPanel = true
	#If true, hides the category header bar.
	hideCategoryHeader = false
	#How quest filters are displayed: tabs, buttons, hidden.
	filterDisplayMode = "tabs"
	#If true, disables category tabs and category-based filtering.
	disableCategories = false
	#show the id field for elements in the editor, instead of auto generating
	showIdField = false
	#If false, disables the built-in Boundless quest pack.
	enableBuiltinQuestPack = true
	#If true, hides icons in quest list widgets.
	hideQuestWidgetIcons = false
	#Scales quest list widget titles and quest detail description, task, and reward text. Range: 0.5 to 1.0.
	# Default: 1.0
	# Range: 0.5 ~ 1.0
	questTextScale = 1.0
	#Scales quest widget icons and quest detail panel icons. Range: 0.5 to 1.0.
	# Default: 1.0
	# Range: 0.5 ~ 1.0
	questIconScale = 1.0
	#If true, shows the quest search box above the quest list.
	enableQuestSearchBox = false
	#If true, shows the expand panel button on tree quest views.
	expandTreeToggle = true
	#If true, renders custom category backgrounds in quest lists and trees.
	customBackgrounds = true
	#If true, allows category background themes on this client.
	enableBackgroundThemes = true
	#If true, keeps the quest details header fixed above the description.
	stickyDescriptionHeaders = true
	#If true, allows colored quest descriptions to render with Boundless color tokens.
	enableDescriptionColors = true
	#Hex color used for quest widget titles. Example: FFFFFF
	questWidgetTextColor = "FFFFFF"
	#Hex color used for quest description text when no inline color token overrides it. Example: CFCFCF
	descriptionTextColor = "CFCFCF"
	#Hex color used for quest description titles. Example: FFFFFF
	descriptionTitleColor = "FFFFFF"
	#Hex color used for requirement headings. Example: FF9F0F
	requiresTextColor = "FF9F0F"
	#Hex color used for submit and input headings. Example: 1D9633
	submitTextColor = "1D9633"
	#Hex color used for collect headings. Example: 1D9633
	collectTextColor = "1D9633"
	#Hex color used for kill headings. Example: FF5555
	killTextColor = "FF5555"
	#Hex color used for effect headings. Example: 55FFFF
	effectTextColor = "55FFFF"
	#Hex color used for advancement headings. Example: 55FFFF
	achieveTextColor = "55FFFF"
	#Hex color used for observation headings. Example: B46CFF
	observeTextColor = "B46CFF"
	#Hex color used for biome headings. Example: 55CC55
	biomeTextColor = "55CC55"
	#Hex color used for dimension headings. Example: FF5555
	dimensionTextColor = "FF5555"
	#Hex color used for reward headings and entries. Example: A8FFA8
	rewardTextColor = "A8FFA8"
	#Hex color used for completed objective text. Example: 55FF55
	completedTextColor = "55FF55"
	#Hex color used for incomplete and invalid objective text. Example: FF5555
	incompleteTextColor = "FF5555"
	#Hex color used for category unlock text. Example: FFD700
	unlockTextColor = "FFD700"
	#If true, long quest descriptions collapse behind a read-more toggle.
	enableDescriptionReadMore = true
	#If true, quest descriptions wrap to fit the detail panel width.
	enableDescriptionTextWrapping = true
	#Quest description text alignment: left, center, right, adjust.
	descriptionTextAlignment = "left"
	#If true, shows quest unlocked toasts.
	enableQuestToasts = true

[Functionality]
	#If true, quest pinning and pinned HUD are disabled.
	disableQuestPinning = false
	#If true, quest rewards are automatically claimed when a quest becomes complete.
	autoClaimQuestRewards = false
	#If true, optional quests can be rejected from the quest book.
	enableQuestRejecting = true
	#If true, quest completion scrolls can be created and used.
	enableQuestScrolls = true
	#If true, operators can open a quest directly in the editor from its quest-book page.
	quickEdit = false
	#If true, quest titles and descriptions use the translation matching the client's language when available.
	multiLanguageQuests = true
	#Preferred quest translation language. Use client to follow the client's selected language.
	preferredLanguage = "client"
	#Automatic questpack backup interval: 1m, 5m, 10m, 30m, off.
	questPackBackupInterval = "5m"

[Gameplay]
	#If true, disables the quest book item and keybind while keeping the inventory panel available.
	disableQuestBook = false
	#If true, players spawn with the quest book.
	spawnWithQuestBook = false

[Development]
	#Enables Boundless development performance diagnostics. Keep false during normal play.
	devMode = false
	#Logs questpack discovery, parsing, reload, and evaluation timings while devMode is enabled.
	debugQuestLoading = true
	#Logs slow quest book and editor UI frames while devMode is enabled.
	debugUiPerformance = true
	#Logs questpack upload, download, and synchronization diagnostics while devMode is enabled.
	debugNetworkTransfers = true
