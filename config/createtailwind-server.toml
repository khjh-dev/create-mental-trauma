[jetpack]
	#Average air drawn from the jetpack per tick of flight or elytra boost. Fractions are drawn as a chance each tick.
	# Default: 0.3
	# Range: 0.0 ~ 1000.0
	airConsumptionPerTick = 0.3
	#Whether a worn jetpack protects from fall damage the way creative flight does.
	immuneToFallDamage = false
	#Whether jetpack flight removes Invisibility, since the exhaust gives the player away.
	removeInvisibility = true

[elytraBoost]
	#How hard a jetpack worn with an elytra pushes a glide along while forward is held, in blocks per tick gained each tick from a standstill. The push fades as the glide nears the top speed.
	# Default: 0.1
	# Range: 0.0 ~ 10.0
	acceleration = 0.1
	#The glide speed, in blocks per tick, at which the jetpack stops adding to it. A dive can still go faster.
	# Default: 2.0
	# Range: 0.1 ~ 100.0
	maxSpeed = 2.0
