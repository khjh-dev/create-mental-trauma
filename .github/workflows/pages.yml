name: Deploy pack to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Проверка пака
        run: |
          test -f pack.toml || { echo "нет pack.toml"; exit 1; }
          test -f index.toml || { echo "нет index.toml"; exit 1; }
          echo "файлов в индексе: $(grep -c '^\[\[files\]\]' index.toml)"
          echo "модов: $(ls mods | wc -l)"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
